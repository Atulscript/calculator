# calculator11.com — Nginx server block for the Hostinger VPS.
#
# Build with:  npm run build:vps
# Deploy:      copy dist/ to /var/www/calculator11
#
# This replaces the GitHub Pages setup, which cannot issue server-side
# redirects. The 301s below are the ones documented in
# docs/seo-master-plan.md section H; until this config is live those four
# pages rely on cross-canonical tags, which consolidate more slowly.

server {
    listen 80;
    listen [::]:80;
    server_name calculator11.com www.calculator11.com;

    # Everything to HTTPS.
    return 301 https://calculator11.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.calculator11.com;

    ssl_certificate     /etc/letsencrypt/live/calculator11.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calculator11.com/privkey.pem;

    # Single canonical host. Pick one and redirect the other — serving both
    # splits ranking signals between two hostnames.
    return 301 https://calculator11.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name calculator11.com;

    root /var/www/calculator11;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/calculator11.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calculator11.com/privkey.pem;

    # ---------------------------------------------------------------------
    # SEO consolidation redirects (docs/seo-master-plan.md section H)
    #
    # Each of these duplicated an existing page's search intent. The target
    # page absorbs the query as an H2 section. Once these are live, the
    # cross-canonical tags in seoRegistry.ts become redundant but harmless.
    # ---------------------------------------------------------------------
    location = /date-difference-calculator    { return 301 /date-calculator; }
    location = /overweight-calculator         { return 301 /bmi-calculator; }
    location = /healthy-weight-calculator     { return 301 /ideal-weight-calculator; }
    location = /engine-horsepower-calculator  { return 301 /horsepower-calculator; }

    # Trailing-slash variants, so both forms resolve.
    location = /date-difference-calculator/   { return 301 /date-calculator; }
    location = /overweight-calculator/        { return 301 /bmi-calculator; }
    location = /healthy-weight-calculator/    { return 301 /ideal-weight-calculator; }
    location = /engine-horsepower-calculator/ { return 301 /horsepower-calculator; }

    # ---------------------------------------------------------------------
    # Static assets. Vite fingerprints these filenames, so they are safe to
    # cache indefinitely.
    # ---------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|woff2|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # These change every deploy and must never be served stale.
    location = /sitemap.xml  { expires -1; add_header Cache-Control "no-cache"; }
    location = /robots.txt   { expires -1; add_header Cache-Control "no-cache"; }

    # index.html must revalidate or users keep an old bundle after a deploy.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------------------------------------------------------------------
    # SPA fallback. Client-side routing means any unmatched path should serve
    # index.html and let the app resolve it — including its own 404 page.
    #
    # Note this returns 200 for genuinely unknown URLs. The app renders
    # NotFoundPage for those; if soft-404s become a problem in Search Console,
    # prerendering or SSR is the real fix.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Basic hardening. Calculations run client-side and nothing is collected,
    # so a restrictive policy costs nothing here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
